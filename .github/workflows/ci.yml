# CI pipeline for Steuererklärung Buddy (Next.js).
# Runs on every push and pull request to master.
# A broken build on a tax calculator is a trust issue — CI catches
# errors before they reach users who are relying on accurate numbers.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript strict mode — tax calculation types must be exact
      - name: Type check
        run: npx tsc --noEmit

      # Next.js lint — zero warnings policy
      - name: Lint
        run: npx eslint . --max-warnings 0

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build with placeholder env vars — validates the bundle compiles.
      # Real secrets are injected by Vercel at deploy time.
      # We use placeholders here so the build succeeds without real keys.
      - name: Build
        run: npm run build
        env:
          GOOGLE_CLOUD_VISION_API_KEY: dummykey
          GROQ_API_KEY: dummykey
          NEXT_PUBLIC_SUPABASE_URL: dummyurl
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummykey
          NEXT_PUBLIC_APP_URL: dummyurl

      # Upload build artifact for inspection if deploy fails
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the production Docker image to verify it compiles cleanly.
      # We verify the /api/health endpoint responds before marking success.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=dummyurl \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=dummykey \
            --build-arg GROQ_API_KEY=dummykey \
            --build-arg GOOGLE_CLOUD_VISION_API_KEY=dummykey \
            -t steuererklaerung-buddy:ci \
            .

      - name: Verify container starts and health check passes
        run: |
          docker run -d \
            --name steuer-test \
            -p 3000:3000 \
            -e GROQ_API_KEY=placeholder \
            -e GOOGLE_CLOUD_VISION_API_KEY=placeholder \
            steuererklaerung-buddy:ci

          sleep 12
          curl --fail --silent http://localhost:3000/api/health || exit 1
          docker stop steuer-test